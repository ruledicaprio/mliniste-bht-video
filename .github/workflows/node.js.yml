# Unit tests for the intro and outro renderers.
#
# Deliberately does not render: that needs a real Chrome, ffmpeg, and the
# untracked source footage, and the output is a multi-hundred-megabyte frame
# dump. The suite covers the parts that are pure logic — the SVG path parser,
# the easing curves, both pieces' phase tables and plate indexing, and the
# preview server — which is where the bugs actually were.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # puppeteer-core's @puppeteer/browsers requires >=22.12.
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm test
